<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
  <title id="title">Role-Based User Interface Structure of the Freelancer Milestone Payment DApp</title>
  <desc id="desc">A role-based UI navigation diagram showing entry through MetaMask and wallet sign-in, common navigation, and client, freelancer, and arbitrator workflows.</desc>
  <defs>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #152232; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #52616f; }
      .section { font: 700 16px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 1px; }
      .role { font: 700 21px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .node-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #172033; }
      .node-body { font: 400 14px Arial, Helvetica, sans-serif; fill: #465467; }
      .small { font: 400 12px Arial, Helvetica, sans-serif; fill: #52616f; }
      .tiny { font: 400 11px Arial, Helvetica, sans-serif; fill: #5b6777; }
      .white { fill: #ffffff; }
      .line { fill: none; stroke: #7b8794; stroke-width: 2.3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #7b8794; stroke-width: 2.3; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #a8b2bf; stroke-width: 1.6; marker-end: url(#arrowSmall); }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/></marker>
    <marker id="arrowSmall" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#a8b2bf"/></marker>
  </defs>

  <rect width="1800" height="1200" fill="#fbfcfe"/>
  <rect x="40" y="34" width="1720" height="1232" rx="18" fill="#ffffff" stroke="#d9e1ea" stroke-width="2"/>

  <text x="90" y="88" class="title">Role-Based User Interface Structure</text>
  <text x="90" y="118" class="subtitle">Freelancer Milestone Payment DApp - current integrated frontend</text>
  <line x1="90" y1="142" x2="1710" y2="142" stroke="#d9e1ea" stroke-width="2"/>

  <!-- Entry -->
  <text x="90" y="180" class="section">ENTRY AND IDENTITY</text>
  <g filter="url(#shadow)">
    <rect x="645" y="168" width="510" height="72" rx="12" fill="#eaf1f8" stroke="#7c9bb9" stroke-width="2"/>
  </g>
  <text x="900" y="198" text-anchor="middle" class="node-title">Header: Connect MetaMask</text>
  <text x="900" y="221" text-anchor="middle" class="node-body">Sign in with wallet - nonce message signature</text>
  <path d="M900 240 L900 274" class="line"/>
  <g filter="url(#shadow)">
    <rect x="535" y="278" width="730" height="82" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="900" y="310" text-anchor="middle" class="node-title">Authenticated wallet and role identification</text>
  <text x="900" y="336" text-anchor="middle" class="node-body">If a wallet has multiple roles, the header exposes an Active role selector.</text>

  <!-- Shared nav -->
  <path d="M900 360 L900 400" class="line"/>
  <text x="90" y="405" class="section">SHARED NAVIGATION - ALL SIGNED-IN ROLES</text>
  <g filter="url(#shadow)">
    <rect x="90" y="422" width="1620" height="112" rx="14" fill="#f5f7fa" stroke="#aab7c5" stroke-width="2"/>
  </g>
  <text x="125" y="455" class="node-title">Persistent sidebar</text>
  <text x="125" y="480" class="small">Every signed-in role can navigate to these routed pages. Data and available actions are checked by role and project relationship.</text>
  <g>
    <rect x="125" y="495" width="190" height="25" rx="6" fill="#ffffff" stroke="#b8c4d0"/>
    <text x="220" y="512" text-anchor="middle" class="small">Dashboard</text>
    <rect x="335" y="495" width="190" height="25" rx="6" fill="#ffffff" stroke="#b8c4d0"/>
    <text x="430" y="512" text-anchor="middle" class="small">Projects</text>
    <rect x="545" y="495" width="190" height="25" rx="6" fill="#ffffff" stroke="#b8c4d0"/>
    <text x="640" y="512" text-anchor="middle" class="small">Transactions</text>
    <rect x="755" y="495" width="190" height="25" rx="6" fill="#ffffff" stroke="#b8c4d0"/>
    <text x="850" y="512" text-anchor="middle" class="small">Event logs</text>
    <rect x="965" y="495" width="190" height="25" rx="6" fill="#ffffff" stroke="#b8c4d0"/>
    <text x="1060" y="512" text-anchor="middle" class="small">Disputes</text>
    <rect x="1175" y="495" width="250" height="25" rx="6" fill="#ffffff" stroke="#b8c4d0"/>
    <text x="1300" y="512" text-anchor="middle" class="small">Project detail (authorised)</text>
    <text x="1512" y="512" text-anchor="middle" class="tiny">Transactions and Event logs are read-only.</text>
  </g>

  <!-- Role lanes -->
  <path d="M900 534 L900 571" class="line"/>
  <text x="90" y="578" class="section">ROLE-SPECIFIC UI WORKFLOWS</text>

  <!-- Client Lane -->
  <g filter="url(#shadow)">
    <rect x="90" y="600" width="500" height="500" rx="16" fill="#f7fbff" stroke="#4d86bd" stroke-width="2"/>
    <rect x="90" y="600" width="500" height="50" rx="16" fill="#3978b5"/>
    <rect x="90" y="634" width="500" height="16" fill="#3978b5"/>
  </g>
  <text x="340" y="633" text-anchor="middle" class="role">CLIENT</text>
  <text x="340" y="677" text-anchor="middle" class="small">Create, fund, review and dispute milestone work</text>
  <g filter="url(#shadow)">
    <rect x="120" y="704" width="440" height="72" rx="10" fill="#ffffff" stroke="#9abfe1"/>
  </g>
  <text x="340" y="732" text-anchor="middle" class="node-title">Dashboard or Projects</text>
  <text x="340" y="755" text-anchor="middle" class="node-body">Client-only “Create project” link</text>
  <path d="M340 776 L340 808" class="line"/>
  <g filter="url(#shadow)"><rect x="120" y="812" width="440" height="82" rx="10" fill="#e8f3ff" stroke="#4d86bd"/></g>
  <text x="340" y="842" text-anchor="middle" class="node-title">Create project</text>
  <text x="340" y="865" text-anchor="middle" class="node-body">Define freelancer, total ETH and milestones</text>
  <path d="M340 894 L340 925" class="line"/>
  <g filter="url(#shadow)"><rect x="120" y="929" width="440" height="126" rx="10" fill="#ffffff" stroke="#9abfe1"/></g>
  <text x="340" y="958" text-anchor="middle" class="node-title">Project detail</text>
  <text x="340" y="981" text-anchor="middle" class="node-body">Cancel while CREATED - fund full escrow</text>
  <text x="340" y="1004" text-anchor="middle" class="node-body">Approve &amp; release, reject, or raise dispute</text>
  <text x="340" y="1032" text-anchor="middle" class="tiny">Open disputes: Submit evidence is available on the Disputes page.</text>

  <!-- Freelancer Lane -->
  <g filter="url(#shadow)">
    <rect x="650" y="600" width="500" height="500" rx="16" fill="#fffaf2" stroke="#c68a32" stroke-width="2"/>
    <rect x="650" y="600" width="500" height="50" rx="16" fill="#bd7a18"/>
    <rect x="650" y="634" width="500" height="16" fill="#bd7a18"/>
  </g>
  <text x="900" y="633" text-anchor="middle" class="role">FREELANCER</text>
  <text x="900" y="677" text-anchor="middle" class="small">Accept assigned work, submit milestones and dispute</text>
  <g filter="url(#shadow)"><rect x="680" y="704" width="440" height="72" rx="10" fill="#ffffff" stroke="#e1b873"/></g>
  <text x="900" y="732" text-anchor="middle" class="node-title">Dashboard or Projects</text>
  <text x="900" y="755" text-anchor="middle" class="node-body">Open a wallet-assigned project</text>
  <path d="M900 776 L900 808" class="line"/>
  <g filter="url(#shadow)"><rect x="680" y="812" width="440" height="148" rx="10" fill="#ffffff" stroke="#e1b873"/></g>
  <text x="900" y="842" text-anchor="middle" class="node-title">Project detail</text>
  <text x="900" y="865" text-anchor="middle" class="node-body">Accept project - start milestone</text>
  <text x="900" y="888" text-anchor="middle" class="node-body">Submit / resubmit milestone</text>
  <text x="900" y="911" text-anchor="middle" class="node-body">Claim after review period - raise dispute</text>
  <text x="900" y="937" text-anchor="middle" class="tiny">Open disputes: Submit evidence is available on the Disputes page.</text>
  <path d="M900 960 L900 993" class="dash"/>
  <text x="914" y="981" class="tiny">to Disputes</text>

  <!-- Arbitrator Lane -->
  <g filter="url(#shadow)">
    <rect x="1210" y="600" width="500" height="500" rx="16" fill="#fbf8fe" stroke="#8965b3" stroke-width="2"/>
    <rect x="1210" y="600" width="500" height="50" rx="16" fill="#74509f"/>
    <rect x="1210" y="634" width="500" height="16" fill="#74509f"/>
  </g>
  <text x="1460" y="633" text-anchor="middle" class="role">ARBITRATOR</text>
  <text x="1460" y="677" text-anchor="middle" class="small">Review open cases and make a binary resolution</text>
  <g filter="url(#shadow)"><rect x="1240" y="704" width="440" height="72" rx="10" fill="#ffffff" stroke="#b69bd4"/></g>
  <text x="1460" y="732" text-anchor="middle" class="node-title">Dashboard, Projects and Project detail</text>
  <text x="1460" y="755" text-anchor="middle" class="node-body">Authorised visibility; project detail has no workflow action</text>
  <path d="M1460 776 L1460 808" class="line"/>
  <g filter="url(#shadow)"><rect x="1240" y="812" width="440" height="144" rx="10" fill="#f6f0fc" stroke="#8965b3"/></g>
  <text x="1460" y="842" text-anchor="middle" class="node-title">Disputes</text>
  <text x="1460" y="865" text-anchor="middle" class="node-body">View open case metadata and recorded evidence</text>
  <line x1="1460" y1="883" x2="1460" y2="899" class="thin"/>
  <text x="1460" y="921" text-anchor="middle" class="node-title">Resolve dispute</text>
  <text x="1460" y="942" text-anchor="middle" class="node-body">Release to freelancer OR refund client</text>

  <!-- Reconciliation / shared outcomes -->
  <path d="M340 1055 L340 1147 L650 1147" class="dash"/>
  <path d="M900 960 L900 1110" class="dash"/>
  <path d="M1460 956 L1460 1147 L1150 1147" class="dash"/>
  <g filter="url(#shadow)"><rect x="655" y="1114" width="490" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8"/></g>
  <text x="900" y="1141" text-anchor="middle" class="node-title">Shared audit views: Transactions and Event logs</text>
  <text x="900" y="1164" text-anchor="middle" class="node-body">Wallet-relevant verified records; both pages are read-only.</text>

  <!-- Legend -->
  <g>
    <rect x="90" y="1212" width="18" height="12" fill="#e8f3ff" stroke="#4d86bd"/>
    <text x="115" y="1223" class="tiny">Client-specific UI</text>
    <rect x="235" y="1212" width="18" height="12" fill="#fff6e7" stroke="#c68a32"/>
    <text x="260" y="1223" class="tiny">Freelancer-specific UI</text>
    <rect x="425" y="1212" width="18" height="12" fill="#f6f0fc" stroke="#8965b3"/>
    <text x="450" y="1223" class="tiny">Arbitrator-specific UI</text>
    <rect x="610" y="1212" width="18" height="12" fill="#f5f7fa" stroke="#94a3b8"/>
    <text x="635" y="1223" class="tiny">Shared UI</text>
    <line x1="740" y1="1218" x2="775" y2="1218" class="dash"/>
    <text x="786" y="1223" class="tiny">Contextual navigation or outcome</text>
  </g>
</svg>
